name: .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AntiSpamBot.slnx

      - name: Build
        run: dotnet build AntiSpamBot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AntiSpamBot.slnx --configuration Release --no-build --verbosity normal

      - name: Vulnerable packages
        run: dotnet list AntiSpamBot.csproj package --vulnerable --include-transitive
